version: "2"
linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
  disable:
    - errcheck
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Test fixtures with hardcoded fake secrets (topsecret/xyz) are intentional.
      - linters: [gosec]
        path: _test\.go
        text: G101|G102|G103|G106
      # By design: wrk3 shells out to git/gh/docker and runs entry.*
      # strings via sh -c — subprocess-with-variable is the product.
      - linters: [gosec]
        text: G204
      # By design: state/.env/config/copy paths come from wrk3.yaml +
      # state file — file-inclusion-via-variable is the product. copy.go
      # additionally guards with IsAbs/escape/withinDir checks that taint
      # analysis (G703) cannot see.
      - linters: [gosec]
        text: G304|G703
      # By design: managed .env files, pid files, installed binaries and
      # worktree dirs use 0644/0755 (see CONFIGURATION.md). Covers G301
      # (dirs), G302 (chmod) and G306 (WriteFile).
      - linters: [gosec]
        text: G301|G302|G306
      # Test-only XSS-taint finding in proxy handler tests.
      - linters: [gosec]
        path: _test\.go
        text: G705
issues:
  max-issues-per-linter: 50
  max-same-issues: 20
formatters:
  enable:
    - gofmt
    - goimports
