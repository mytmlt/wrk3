name: Release

# Manual-tag fallback: pushing a v*.*.* tag runs GoReleaser.
# (Automatic releases run in `tag.yml`, whose
# GITHUB_TOKEN tag push intentionally does not re-trigger this.)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public client identifier (not a secret, see SECURITY.md).
          # Forks can replace with their own DSN or an empty string to strip.
          SENTRY_DSN: https://5453eb392d183be1161ff1da5450c98e@o4512095348916224.ingest.de.sentry.io/4512124896608336
