name: OpenCodeReview

# AI code review bot: posts inline + summary PR comments via github-actions[bot].
# Requires repo secrets:
#   OCR_LLM_URL   = https://opencode.ai/zen/v1
#   OCR_LLM_TOKEN = OpenCode Zen API key (https://opencode.ai/auth)
#   OCR_LLM_MODEL = muse-spark-1.3  (paid) or muse-spark-1.3-contributor-free
# Zen serves Muse Spark ONLY via the OpenAI Responses API, hence
# llm_protocol: openai-responses (OCR appends /responses to the base URL).
# Runs on collaborator PRs; no fork-PR handling (see pull_request_target docs
# if forks ever need reviews).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: alibaba/open-code-review@v1.12.9
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          llm_protocol: openai-responses
          # Empty object: the action default sends {"thinking":...}, which
          # strict OpenAI-compatible endpoints reject with HTTP 400.
          llm_extra_body: '{}'
          language: English
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sticky_summary: 'true'
          incremental: 'false'
          upload_artifacts: 'true'
          effort: medium
