name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -short -count=1
      # Ubuntu-only: the e2e happy path runs `up`/`down` (docker compose)
      # and `exec ... sh -c`, which need a daemon + sh. macOS/Windows
      # runners have neither by default; the tests also self-skip there.
      - run: go test -tags e2e ./tests/e2e/ -short -count=1
        if: matrix.os == 'ubuntu-latest'
      - run: go run . --help
      - run: go run . version

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: go test ./internal/runner/ -count=1 -run 'Integration|Parallel' -v
      - run: WRK3_E2E_DOCKER=1 go test -tags e2e ./tests/e2e/ -count=1 -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: ./...
