# Dogfood config: use wrk3 on the wrk3 repo itself for branch/worktree
# management (`fetch`, `add`, `ls`, `exec`, `status`). See AGENTS.md.
#
# This repo has no docker stack, so `runner.type: none` skips compose
# operations (ports, .env, compose up/down). The Go gate
# (`go build ./... && go vet ./... && go test ./... -count=1`) is the
# verification loop — run it via `wrk3 exec <branch> -- make test`.
# `status` shows WORKTREE/BRANCH/STATUS (no ports or compose project).
project:
  worktreeBase: .worktrees
source:
  type: git
  git:
    remote: origin
    fetchPrune: true
runner:
  type: none
entry:
  setup: []
  run: ""
  stop: ""
  reload: []