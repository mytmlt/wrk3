# Dogfood config: use wrk3 on the wrk3 repo itself for branch/worktree
# management (`fetch`, `add`, `ls`, `up`, `exec`). See AGENTS.md.
#
# CLI-only: no compose stack and no bound ports. Isolation is the
# worktree directory — `up` builds this checkout's binary, `exec` runs
# with cwd=worktree (e.g. `wrk3 exec feat-a -- go test ./...`).
project:
  worktreeBase: .worktrees
source:
  type: git
  git:
    remote: origin
    fetchPrune: true
runner:
  type: local
entry:
  run: "go build -o bin/wrk3 ."
  stop: "true"
