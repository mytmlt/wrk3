# Dogfood config: use wrk3 on the wrk3 repo itself for branch/worktree
# management (`fetch`, `add`, `ls`, `exec`). See AGENTS.md (Isolate step).
#
# This repo is a single Go binary with no docker stack — `up`/`down` run
# the configured entry commands directly on the host via the local runner,
# and `status` reads from the state file (no live daemon probe).
project:
  worktreeBase: .worktrees
source:
  type: git
  git:
    remote: origin
    fetchPrune: true
runner:
  type: local
entry:
  run: "echo up complete (use go build + go test)"
  stop: "echo stop"
