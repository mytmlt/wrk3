# Dogfood config: use wrk3 on the wrk3 repo itself for branch/worktree
# management (`fetch`, `add`, `ls`). See AGENTS.md (Isolate step).
#
# This repo has no docker stack, so runner.type is `local`: `up`/`down`
# run entry.setup/run/stop on the host and skip compose. The Go gate
# (`go build ./... && go vet ./... && go test ./... -count=1`) is the
# verification loop. `status` stays `unknown` (no process probe; it
# never fails hard).
project:
  worktreeBase: .worktrees
source:
  type: git
  git:
    remote: origin
    fetchPrune: true
runner:
  type: local
entry:
  run: "echo run (no stack here; use the Go gate)"
  stop: "echo stop"
ports:
  base: {app: 8000}
  ranges:
    app: [8000, 8099]
